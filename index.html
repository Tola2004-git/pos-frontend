<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Security headers (CSP, X-Frame-Options, etc.) live in vercel.json
         instead of here - meta tags can't carry frame-ancestors or apply to
         local dev in any useful way, and a real HTTP header is honored
         everywhere a meta tag CSP wouldn't be (e.g. the raw JSON responses
         this SPA fetches). See vercel.json for the full policy + why. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a2e" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Temple Sourdough</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
